name: Get Team IDs (einmalig)

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s "https://v3.football.api-sports.io/teams?league=78&season=2026" \
            -H "x-apisports-key: ${{ secrets.API_FOOTBALL_KEY }}"
            | node -e "
              let data = '';
              process.stdin.on('data', c => data += c);
              process.stdin.on('end', () => {
                const json = JSON.parse(data);
                json.response.forEach(t => console.log(t.team.id + '\t' + t.team.name));
              });
            "
