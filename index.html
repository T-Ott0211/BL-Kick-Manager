<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bundesliga Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<style>
  :root {
    --bg: #06080d;
    --bg-panel: #10141d;
    --bg-panel-2: #161b26;
    --border: #262c3a;
    --text: #eef1f7;
    --text-dim: #7b8496;
    --gold: #f0c04a;
    --gold-soft: #f0c04a33;
    --gold-dark: #a8791f;
    --radius: 16px;
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;

    --bronze-1: #b3774a; --bronze-2: #6b4324;
    --silver-1: #dfe6ee; --silver-2: #8d97a6;
    --gold-1: #ffe08a; --gold-2: #c9932b;
    --special-1: #b78cf9; --special-2: #5a2fb8;
    --icon-1: #fffdf4; --icon-2: #d9caa0;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef0f4; --bg-panel: #ffffff; --bg-panel-2: #f4f5f8;
      --border: #dde1e8; --text: #10141d; --text-dim: #626b7a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #06080d; --bg-panel: #10141d; --bg-panel-2: #161b26;
    --border: #262c3a; --text: #eef1f7; --text-dim: #7b8496;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--gold-soft), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-bottom: 92px;
    overflow-x: hidden;
  }
  h1, h2, .fcard-value, .fcard-name, .mgr-points, .stat .val, .mgr-name {
    font-family: var(--font-display);
  }

  header {
    padding: 20px 16px 16px;
    background: linear-gradient(180deg, #0b0f17 0%, transparent 100%);
    border-bottom: 1px solid var(--gold-soft);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 {
    margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px; color: var(--text);
  }
  header h1 .gold-word { color: var(--gold); }
  header .sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; font-weight: 500; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #3fd66b; display: inline-block; box-shadow: 0 0 8px #3fd66b; }

  .container { padding: 14px 12px; max-width: 640px; margin: 0 auto; }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .panel h2 {
    margin: 0 0 12px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 7px; letter-spacing: 0.3px;
  }

  .stat-row { display: flex; gap: 10px; margin-bottom: 4px; }
  .stat {
    flex: 1; background: var(--bg-panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 8px; text-align: center;
  }
  .stat .val { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .stat .lab { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 3px; font-family: var(--font-body); font-weight: 600; }
  .stat.budget .val { color: #3fd66b; }
  .stat.points .val { color: var(--gold); }

  /* --- Pitch / formation view --- */
  .pitch {
    position: relative;
    border-radius: 16px;
    min-height: 430px;
    padding: 18px 6px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.22);
    background:
      repeating-linear-gradient(180deg, #2f8f42 0px, #2f8f42 42px, #2a8039 42px, #2a8039 84px);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
  }
  .pitch-lines { position: absolute; inset: 0; pointer-events: none; }
  .pitch-halfway { position: absolute; top: 50%; left: 5%; right: 5%; height: 2px; background: rgba(255,255,255,0.4); }
  .pitch-circle { position: absolute; top: 50%; left: 50%; width: 78px; height: 78px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%,-50%); }
  .pitch-dot { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%,-50%); }
  .pitch-box-top { position: absolute; top: 0; left: 22%; right: 22%; height: 56px; border: 2px solid rgba(255,255,255,0.4); border-top: none; }
  .pitch-box-bottom { position: absolute; bottom: 0; left: 22%; right: 22%; height: 56px; border: 2px solid rgba(255,255,255,0.4); border-bottom: none; }
  .pitch-edge { position: absolute; inset: 6px; border: 2px solid rgba(255,255,255,0.22); border-radius: 10px; }

  .pitch-rows { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-evenly; height: 100%; min-height: 396px; }
  .pitch-row { display: flex; justify-content: space-evenly; align-items: center; flex-wrap: wrap; gap: 6px; }
  .pitch-row-label {
    position: absolute; left: 10px; font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.4);
    text-transform: uppercase; letter-spacing: 0.6px; font-family: var(--font-body);
  }

  .pchip-wrap { display: flex; flex-direction: column; align-items: center; width: 58px; cursor: pointer; }
  .pchip {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11.5px; color: #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45);
    border: 2px solid rgba(255,255,255,0.55);
  }
  .pchip.tier-silver, .pchip.tier-gold, .pchip.tier-icon { color: #1c1508; }
  .pchip-name {
    font-size: 9.5px; font-weight: 700; color: #fff; margin-top: 4px; text-align: center; line-height: 1.15;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7); max-width: 58px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-family: var(--font-body);
  }
  .pchip-pts {
    font-size: 8.5px; color: var(--gold); font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    font-family: var(--font-body);
  }
  .pitch-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 600; padding: 20px;
    font-family: var(--font-body); z-index: 3;
  }
  .pchip-empty {
    background: rgba(255,255,255,0.06); border: 2px dashed rgba(255,255,255,0.3); box-shadow: none;
    color: rgba(255,255,255,0.4); font-size: 16px;
  }
  .bench-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; }
  .bench-row .pchip-wrap { flex-shrink: 0; opacity: 0.85; }

  .mode-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .mode-btn {
    flex: 1; background: var(--bg-panel-2); border: 1px solid var(--border); color: var(--text-dim);
    padding: 10px 6px; font-size: 12px; font-weight: 700; border-radius: 10px; font-family: var(--font-body);
  }
  .mode-btn.active { background: var(--gold); color: #1c1508; border-color: var(--gold); }
  .pchip-selectable { box-shadow: 0 0 0 2px rgba(240,192,74,0.35), 0 3px 10px rgba(0,0,0,0.45); }
  .pchip-selected { box-shadow: 0 0 0 3px var(--gold), 0 3px 14px rgba(240,192,74,0.5); }
  .drop-hover .pchip, .bench-row.drop-hover { box-shadow: 0 0 0 3px #3fd66b, 0 0 14px rgba(63,214,107,0.7) !important; border-radius: 10px; }

  .pchip-wrap { position: relative; }
  .cap-badge {
    position: absolute; top: -6px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(10,12,18,0.85); border: 1.5px solid rgba(255,255,255,0.4);
    color: rgba(255,255,255,0.7); font-size: 10.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); z-index: 5;
  }
  .cap-badge.active { background: var(--gold); color: #1c1508; border-color: var(--gold); box-shadow: 0 0 8px var(--gold); }

  .deadline-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-radius: 12px; margin-bottom: 12px;
    background: var(--bg-panel-2); border: 1px solid var(--border);
  }
  .deadline-banner.open { border-color: rgba(63,214,107,0.4); }
  .deadline-banner.locked { border-color: rgba(255,92,92,0.5); background: rgba(255,92,92,0.08); }
  .deadline-label { font-size: 12px; font-weight: 700; }
  .deadline-sub { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; font-family: var(--font-body); }
  .locked-tag { font-size: 11px; font-weight: 800; color: #ff5c5c; }

  .locked-zone { opacity: 0.45; pointer-events: none; position: relative; }
  .locked-zone::after { content: ""; }

  .deadline-form { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .deadline-form input[type="datetime-local"] {
    flex: 1; min-width: 160px; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--bg-panel-2); color: var(--text); font-family: var(--font-body); font-size: 13px;
  }
  .deadline-form button { width: auto; padding: 10px 14px; }

  .fcard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .fcard {
    position: relative;
    border-radius: 14px;
    padding: 12px 10px 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    min-height: 148px;
  }
  .tier-bronze { background: linear-gradient(160deg, var(--bronze-1), var(--bronze-2)); }
  .tier-silver { background: linear-gradient(160deg, var(--silver-1), var(--silver-2)); }
  .tier-gold   { background: linear-gradient(160deg, var(--gold-1), var(--gold-2)); }
  .tier-special{ background: linear-gradient(160deg, var(--special-1), var(--special-2)); }
  .tier-icon   { background: linear-gradient(160deg, var(--icon-1), var(--icon-2)); }
  .tier-silver .fcard-name, .tier-silver .fcard-club,
  .tier-gold .fcard-name, .tier-gold .fcard-club,
  .tier-icon .fcard-name, .tier-icon .fcard-club { color: #1c1508; }
  .tier-silver .fcard-value, .tier-gold .fcard-value, .tier-icon .fcard-value { color: #1c1508; }
  .tier-silver .fcard-pos, .tier-gold .fcard-pos, .tier-icon .fcard-pos { background: rgba(0,0,0,0.18); color: #1c1508; }

  .fcard-top { display: flex; justify-content: space-between; width: 100%; align-items: flex-start; }
  .fcard-value { font-size: 22px; font-weight: 700; color: #fff; line-height: 1; }
  .fcard-pos {
    font-size: 10px; font-weight: 700; background: rgba(255,255,255,0.22);
    color: #fff; padding: 3px 7px; border-radius: 6px; letter-spacing: 0.4px;
  }
  .fcard-badge { font-size: 26px; margin: 6px 0 2px; }
  .fcard-avatar {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    margin: 6px auto 2px;
  }
  .fcard-name { font-size: 14.5px; font-weight: 600; color: #fff; line-height: 1.15; margin-top: 4px; }
  .fcard-club { font-size: 10.5px; color: rgba(255,255,255,0.75); margin-top: 2px; font-family: var(--font-body); }
  .fcard-points {
    margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--gold);
    background: rgba(0,0,0,0.35); padding: 2px 10px; border-radius: 8px;
  }
  .tier-silver .fcard-points, .tier-gold .fcard-points, .tier-icon .fcard-points { background: rgba(0,0,0,0.15); }
  .fcard-action { margin-top: 8px; width: 100%; }

  .offer-box {
    width: 100%; margin-top: 8px; padding: 8px; border-radius: 10px;
    background: rgba(0,0,0,0.25); font-family: var(--font-body);
  }
  .offer-box input[type="number"] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.3); color: #fff; font-size: 13px; font-family: var(--font-body);
  }
  .offer-line { font-size: 11.5px; color: rgba(255,255,255,0.85); margin-bottom: 4px; }
  .offer-btnrow { display: flex; gap: 6px; }
  .offer-btnrow button { flex: 1; font-size: 11px; padding: 7px 6px; }
  .incoming-offers { width: 100%; margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.25); padding-top: 8px; }

  button {
    font-family: var(--font-body);
    border: none; border-radius: 9px; padding: 8px 12px;
    font-weight: 700; font-size: 12px; cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease; width: 100%;
  }
  button:active { transform: scale(0.95); }
  .btn-buy { background: linear-gradient(135deg, #3fd66b, #24a350); color: #06210c; }
  .btn-sell { background: linear-gradient(135deg, #ff5c5c, #c23a3a); color: white; }
  .btn-disabled { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.5); opacity: 0.7; cursor: not-allowed; }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 4px;
    background: rgba(16,20,29,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--gold-soft);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  nav.tabs button {
    flex: 1; background: transparent; color: var(--text-dim);
    padding: 7px 4px; font-size: 10.5px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border-radius: 10px; font-family: var(--font-body); width: auto;
  }
  nav.tabs button.active { color: var(--gold); background: var(--gold-soft); }
  nav.tabs .icon { font-size: 19px; }

  .filter-row { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
  .filter-chip {
    background: var(--bg-panel-2); border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 13px; border-radius: 20px; font-size: 11.5px; white-space: nowrap; cursor: pointer;
    font-weight: 600;
  }
  .filter-chip.active { background: var(--gold); color: #1c1508; border-color: var(--gold); }

  .table-row { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-bottom: 1px solid var(--border); }
  .table-row:last-child { border-bottom: none; }
  .rank { font-weight: 700; font-size: 17px; width: 26px; color: var(--text-dim); }
  .rank.r1 { color: #ffd54a; text-shadow: 0 0 10px #ffd54a88; }
  .rank.r2 { color: #d7dee6; }
  .rank.r3 { color: #cd8a4d; }
  .mgr-name { font-weight: 700; font-size: 15px; }
  .mgr-detail { font-size: 11px; color: var(--text-dim); font-family: var(--font-body); }
  .mgr-points { font-weight: 700; color: var(--gold); font-size: 18px; }

  .empty-state { text-align: center; padding: 34px 20px; color: var(--text-dim); grid-column: 1 / -1; }
  .empty-state .icon { font-size: 42px; margin-bottom: 10px; }

  input[type="text"], input[type="number"], input[type="password"] {
    width: 100%; padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg-panel-2); color: var(--text);
    font-size: 15px; font-family: var(--font-body);
  }
  .setup-screen {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; text-align: center;
    background: radial-gradient(ellipse 700px 500px at 50% 20%, var(--gold-soft), transparent 65%), var(--bg);
  }
  .setup-screen .logo { font-size: 58px; margin-bottom: 8px; filter: drop-shadow(0 0 20px var(--gold-soft)); }
  .setup-screen h1 { font-size: 30px; margin: 0 0 6px; font-weight: 700; letter-spacing: 0.5px; }
  .setup-screen h1 .gold-word { color: var(--gold); }
  .setup-screen p { color: var(--text-dim); font-size: 13.5px; margin: 0 0 26px; max-width: 300px; line-height: 1.5; }
  .setup-screen input { max-width: 300px; margin-bottom: 12px; }
  .setup-screen .btn-buy { max-width: 300px; padding: 14px; font-size: 14.5px; letter-spacing: 0.3px; }
  .existing-managers { max-width: 300px; width: 100%; margin-top: 22px; }
  .existing-managers .mchip {
    display: block; width: 100%; text-align: left;
    background: var(--bg-panel); border: 1px solid var(--border); color: var(--text);
    padding: 11px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 14px; font-family: var(--font-body); font-weight: 500;
  }

  .admin-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid var(--border);
  }
  .admin-row:last-child { border-bottom: none; }
  .pos-chip {
    width: 30px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; font-weight: 700; flex-shrink: 0; background: var(--bg-panel-2); color: var(--text-dim); border: 1px solid var(--border);
  }
  .admin-row .p-info { flex: 1; min-width: 0; }
  .admin-row .p-name { font-weight: 600; font-size: 13.5px; font-family: var(--font-body); }
  .admin-row .p-club { font-size: 10.5px; color: var(--text-dim); }
  .admin-row input[type="number"] { width: 62px; text-align: center; padding: 8px; flex-shrink: 0; }
  .dnp-toggle { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-dim); flex-shrink: 0; white-space: nowrap; font-family: var(--font-body); }
  .dnp-toggle input { width: 15px; height: 15px; accent-color: #ff5c5c; }

  .hint { font-size: 11.5px; color: var(--text-dim); line-height: 1.55; }
  .toast {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--gold-soft);
    padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    z-index: 50; opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
    font-family: var(--font-body); color: var(--gold);
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>

  {id:"p18",name:"Maximilian Beier",club:"Borussia Dortmund",pos:"ST",value:28},
  // RB Leipzig
  {id:"p19",name:"Maarten Vandevoordt",club:"RB Leipzig",pos:"TW",value:12},
  {id:"p20",name:"David Raum",club:"RB Leipzig",pos:"ABW",value:22},
  {id:"p21",name:"Willi Orban",club:"RB Leipzig",pos:"ABW",value:7},
  {id:"p22",name:"Christoph Baumgartner",club:"RB Leipzig",pos:"MF",value:20},

}

function chunkArray(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

async function seedBatch(list) {
  return Promise.allSettled(
    list.map(p => withTimeout(db.doc("players/" + p.id).set({...p, ownerId: null, points: 0}), 8000, p.name))
  );
}

async function ensureSeeded(force) {
  if (!force) {
    try {
      const meta = await db.doc("meta/seed").get();
      if (meta && meta.exists && meta.data() && meta.data().done) return;
    } catch (err) {
      // meta/seed existiert noch nicht -> weiter unten seeden
    }
  }

  let toSeed = PLAYERS_SEED;
  let failed = [];
  let successCount = 0;
  state.seedProgress = {done: 0, total: toSeed.length};
  render();

  for (const batch of chunkArray(toSeed, 20)) {
    const results = await seedBatch(batch);
    results.forEach((r, i) => { if (r.status === "fulfilled") successCount++; else failed.push(batch[i]); });
    state.seedProgress = {done: successCount + failed.length, total: toSeed.length};
    render();
  }

  if (failed.length > 0) {
    const retry = await seedBatch(failed);
    const stillFailed = [];
    retry.forEach((r, i) => { if (r.status === "fulfilled") successCount++; else stillFailed.push(failed[i]); });
    failed = stillFailed;
    state.seedProgress = {done: successCount + failed.length, total: toSeed.length};
    render();
  }

  state.seedProgress = null;
  if (failed.length === 0) {
    try { await db.doc("meta/seed").set({done: true, at: Date.now()}); } catch (e) {}
    showToast(`Spielerdaten geladen ⚽ (${successCount}/${PLAYERS_SEED.length})`);
  } else {
    console.error("Weiterhin fehlgeschlagen:", failed.map(p => p.name));
    showToast(`${successCount}/${PLAYERS_SEED.length} geladen, ${failed.length} noch offen. Nochmal auf Laden tippen.`);
  }

  try {
    const cfg = await db.doc("league/config").get();
    if (!cfg || !cfg.exists) {
      await db.doc("league/config").set({nextDeadline: null});
    }
  } catch (err) {
    console.error("league/config check failed:", err);
  }
  render();
}

async function initDb() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    await withTimeout(auth.signInAnonymously(), 10000, "Anmeldung");
    db = firebase.firestore();
  } catch (err) {
    console.error("Firebase init failed:", err);
    showToast("Datenbank-Verbindung fehlgeschlagen: " + (err && err.message ? err.message : "unbekannt"));
    render();
    return;
  }

  // Live-Zuhören zuerst registrieren, damit die UI in jedem Fall aktuelle Daten bekommt,
  // auch wenn das Seeden unten fehlschlägt.
  db.collection("players").onSnapshot((snap) => {
    const map = {};
    (snap && snap.docs ? snap.docs : []).forEach(d => { if (d.exists) map[d.id] = d.data(); });
    state.players = map;
    render();
  }, (err) => {
    console.error("players onSnapshot error:", err);
    showToast("Sync-Fehler (Spieler): " + (err && err.message ? err.message : err.code || "unbekannt"));
  });

  db.collection("managers").onSnapshot((snap) => {
    const map = {};
    (snap && snap.docs ? snap.docs : []).forEach(d => { if (d.exists) map[d.id] = d.data(); });
    state.managers = map;
    if (state.managerId && map[state.managerId]) {
      if (map[state.managerId].formation) state.formation = map[state.managerId].formation;
      if (map[state.managerId].lineupMode) state.lineupMode = map[state.managerId].lineupMode;
    }
    render();
  }, (err) => {
    console.error("managers onSnapshot error:", err);
    showToast("Sync-Fehler (Manager): " + (err && err.message ? err.message : err.code || "unbekannt"));
  });

  db.collection("league").onSnapshot((snap) => {
    const map = {};
    (snap && snap.docs ? snap.docs : []).forEach(d => { if (d.exists) map[d.id] = d.data(); });
    state.league = map;
    render();
  }, (err) => {
    console.error("league onSnapshot error:", err);
  });

  db.collection("offers").onSnapshot((snap) => {
    const map = {};
    (snap && snap.docs ? snap.docs : []).forEach(d => { if (d.exists) map[d.id] = d.data(); });
    state.offers = map;
    render();
  }, (err) => {
    console.error("offers onSnapshot error:", err);
  });

  render();
  await ensureSeeded(false);
}

async function handleLogin(name, pin) {
  name = (name || "").trim();
  pin = (pin || "").trim();
  if (!name) { showToast("Bitte Namen eingeben"); return; }
  if (!/^\d{4}$/.test(pin)) { showToast("PIN muss genau 4 Ziffern sein 🔢"); return; }
  if (!db) { showToast("Datenbank noch nicht bereit, kurz warten..."); return; }
  try {
    const q = await db.collection("managers").where("name", "==", name).get();
    const docs = (q && q.docs) ? q.docs.filter(d => d.exists) : [];
    if (docs.length > 0) {
      const existing = docs[0];
      const data = existing.data();
      if (data.pin !== pin) { showToast("Falscher PIN ❌"); return; }
      state.managerId = existing.id;
      state.managerName = data.name;
      localStorage.setItem("bl_manager_id", existing.id);
      localStorage.setItem("bl_manager_name", data.name);
      showToast("Willkommen zurück, " + data.name + "! 👋");
      render();
    } else {
      const id = uid();
      await db.doc("managers/" + id).set({name, pin, createdAt: Date.now()});
      state.managerId = id;
      state.managerName = name;
      localStorage.setItem("bl_manager_id", id);
      localStorage.setItem("bl_manager_name", name);
      showToast("Konto angelegt, willkommen " + name + "! ⚽");
      render();
    }
  } catch (err) {
    console.error("Login failed:", err);
    showToast("Fehler: " + (err && err.message ? err.message : "unbekannt"));
  }
}

    await Promise.allSettled(mdocs.map(d => db.doc("managers/" + d.id).delete()));

    const plyrs = await db.collection("players").get();
    const pdocs = (plyrs && plyrs.docs) ? plyrs.docs.filter(d => d.exists) : [];
    await Promise.allSettled(pdocs.map(d => db.doc("players/" + d.id).delete()));

    try { await db.doc("meta/seed").delete(); } catch (e) {}

  } catch (err) {
    console.error("Reset failed:", err);
    showToast("Fehler beim Zurücksetzen: " + (err && err.message ? err.message : ""));
  }
}

function formatDeadline(iso) {

}
function remainingLabel(iso) {
  const diff = new Date(iso).getTime() - Date.now();
  if (diff <= 0) return "Deadline vorbei";
  const mins = Math.floor(diff / 60000);
  const days = Math.floor(mins / 1440);
  const hours = Math.floor((mins % 1440) / 60);
  const rem = mins % 60;
  if (days > 0) return `noch ${days}T ${hours}Std`;
  if (hours > 0) return `noch ${hours}Std ${rem}Min`;
  return `noch ${rem}Min`;
}

function isLineupComplete(managerId) {
  const squad = Object.values(state.players).filter(p => p.ownerId === managerId);
  const mgr = state.managers[managerId] || {};
  const formation = getFormation(mgr.formation || "4-4-2");
  const mode = mgr.lineupMode || "auto";
  const slots = starterSlotsFor(managerId);
  const {starters} = pickLineup(squad, formation, mode, slots);
  return Object.values(starters).flat().every(p => p !== null);
}

function computeManagerScore(managerId) {
  const squad = Object.values(state.players).filter(p => p.ownerId === managerId);
  const mgr = state.managers[managerId] || {};
  const formation = getFormation(mgr.formation || "4-4-2");
  const mode = mgr.lineupMode || "auto";
  const slots = starterSlotsFor(managerId);
  const {starters, bench} = pickLineup(squad, formation, mode, slots);
  const rawFlat = Object.values(starters).flat();
  const complete = rawFlat.every(p => p !== null);
  const capId = mgr.captainId || null;
  const eligible = !isLocked() || complete;

  // Auto-Einwechslung: Nur wenn der Startelf-Spieler laut Admin-Flag real NICHT gespielt hat,
  // wird er für die Wertung durch den besten verfügbaren Bank-Spieler gleicher Position ersetzt.
  const usedBenchIds = new Set();
  const effectiveStarters = [];
  Object.keys(starters).forEach(pos => {
    starters[pos].forEach(p => {
      if (!p) return;
      if (p.didNotPlay) {
        const sub = bench
          .filter(b => b.pos === pos && !usedBenchIds.has(b.id) && !b.didNotPlay)
          .sort((a,b2) => (b2.points||0) - (a.points||0))[0];
        if (sub) {
          usedBenchIds.add(sub.id);
          effectiveStarters.push({player: sub, isSub: true, replacedName: p.name});
          return;
        }
      }
      effectiveStarters.push({player: p, isSub: false});
    });
  });

  let total = 0;
  if (eligible) {
    effectiveStarters.forEach(({player, isSub}) => {
      const isCap = !isSub && player.id === capId;
      total += (player.points || 0) * (isCap ? 2 : 1);
    });
  }

  return {
    total,
    starters: rawFlat.filter(Boolean),
    effectiveStarters,
    captainId: capId,
    squadValue: squad.reduce((s,p) => s + costOf(p), 0),
    squadSize: squad.length,
    complete,
    eligible
  };
}

function myPoints() { return computeManagerScore(state.managerId).total; }
function myCaptainId() { return (state.managers[state.managerId] && state.managers[state.managerId].captainId) || null; }

function hostId() {
  const entries = Object.entries(state.managers || {});
  if (entries.length === 0) return null;
  entries.sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));
  return entries[0][0];
}
function isHost() { return state.managerId && hostId() === state.managerId; }

async function buyPlayer(id) {
  const p = state.players[id];
  if (!p || p.ownerId) return;
  const cost = priceOf(p);
  const used = myBudgetUsed();
  if (used + cost > BUDGET_TOTAL) { showToast("Budget reicht nicht! 💸"); return; }
  if (mySquad().length >= SQUAD_SIZE_LIMIT) { showToast("Kader voll (" + SQUAD_SIZE_LIMIT + ")! 🚫"); return; }
  await db.doc("players/" + id).update({ownerId: state.managerId, listed: false, paidPrice: cost});
  showToast(p.name + " verpflichtet! ⚽");
}

function offersForPlayer(playerId) {
  return Object.entries(state.offers)
    .filter(([id, o]) => o.playerId === playerId)
    .map(([id, o]) => ({...o, id}));
}
function myActiveOfferOn(playerId) {
  return offersForPlayer(playerId).find(o => o.buyerId === state.managerId && (o.status === "pending" || o.status === "countered"));
}

async function listForSale(playerId) {
  const p = state.players[playerId];
  if (!p || p.ownerId !== state.managerId) return;
  await db.doc("players/" + playerId).update({listed: true});
  showToast(p.name + " ist jetzt im Markt gelistet 🏷️");
}

async function instantSell(playerId) {
  const p = state.players[playerId];
  if (!p || p.ownerId !== state.managerId) return;
  const related = offersForPlayer(playerId).filter(o => o.status === "pending" || o.status === "countered");
  await Promise.allSettled(related.map(o => db.doc("offers/" + o.id).update({status: "withdrawn"})));
  await db.doc("players/" + playerId).update({ownerId: null, listed: false, paidPrice: null, points: 0});
  showToast(p.name + " sofort zum Katalogpreis verkauft 💨");
}

async function delist(playerId) {
  const p = state.players[playerId];
  if (!p || p.ownerId !== state.managerId) return;
  await db.doc("players/" + playerId).update({listed: false});
  const related = offersForPlayer(playerId).filter(o => o.status === "pending" || o.status === "countered");
  await Promise.allSettled(related.map(o => db.doc("offers/" + o.id).update({status: "withdrawn"})));
  showToast("Verkauf zurückgezogen");
}

async function makeOffer(playerId, amountStr) {
  const p = state.players[playerId];
  if (!p || !p.listed || p.ownerId === state.managerId) return;
  const amt = parseInt(amountStr, 10);
  if (!amt || amt <= 0) { showToast("Bitte einen gültigen Betrag eingeben"); return; }
  const used = myBudgetUsed();
  if (used + amt > BUDGET_TOTAL) { showToast("Dein Budget reicht für dieses Angebot nicht 💸"); return; }
  if (mySquad().length >= SQUAD_SIZE_LIMIT) { showToast("Kader voll (" + SQUAD_SIZE_LIMIT + ")! 🚫"); return; }
  const id = "offer_" + uid();
  await db.doc("offers/" + id).set({
    playerId, playerName: p.name, buyerId: state.managerId, buyerName: state.managerName,
    sellerId: p.ownerId, amount: amt, counterAmount: null, status: "pending", createdAt: Date.now()
  });
  showToast("Angebot über " + amt + "M abgeschickt 📨");
}

async function withdrawOffer(offerId) {
  const o = state.offers[offerId];
  if (!o || o.buyerId !== state.managerId) return;
  await db.doc("offers/" + offerId).update({status: "withdrawn"});
  showToast("Angebot zurückgezogen");
}

async function finalizeTransfer(offerId, offer, price) {
  await db.doc("players/" + offer.playerId).update({ownerId: offer.buyerId, listed: false, paidPrice: price});
  await db.doc("offers/" + offerId).update({status: "accepted"});
  const others = offersForPlayer(offer.playerId).filter(o => o.id !== offerId && (o.status === "pending" || o.status === "countered"));
  await Promise.allSettled(others.map(o => db.doc("offers/" + o.id).update({status: "withdrawn"})));
  showToast("Transfer abgeschlossen! ✅ " + offer.playerName + " für " + price + "M");
}

async function respondToOffer(offerId, action, counterAmountStr) {
  const o = state.offers[offerId];
  if (!o || o.sellerId !== state.managerId || o.status !== "pending") return;
  if (action === "accept") {
    await finalizeTransfer(offerId, o, o.amount);
  } else if (action === "reject") {
    await db.doc("offers/" + offerId).update({status: "rejected"});
    showToast("Angebot abgelehnt");
  } else if (action === "counter") {
    const amt = parseInt(counterAmountStr, 10);
    if (!amt || amt <= 0) { showToast("Bitte einen gültigen Betrag eingeben"); return; }
    await db.doc("offers/" + offerId).update({status: "countered", counterAmount: amt});
    showToast("Gegenangebot über " + amt + "M gesendet");
  }
}

async function respondToCounter(offerId, action) {
  const o = state.offers[offerId];
  if (!o || o.buyerId !== state.managerId || o.status !== "countered") return;
  if (action === "accept") {
    const used = myBudgetUsed();
    if (used + o.counterAmount > BUDGET_TOTAL) { showToast("Budget reicht für das Gegenangebot nicht 💸"); return; }
    await finalizeTransfer(offerId, o, o.counterAmount);
  } else {
    await db.doc("offers/" + offerId).update({status: "rejected"});
    showToast("Gegenangebot abgelehnt");
  }
}

function getMySlots() {
  return getSlotsForManager(state.managers[state.managerId], getFormation(state.formation));
}

function starterSlotsFor(managerId) {
  const mgr = state.managers[managerId];
  const formation = getFormation((mgr && mgr.formation) || "4-4-2");
  return getSlotsForManager(mgr, formation);
}

function getSlotsForManager(mgr, formation) {
  const need = {TW:1, ABW: formation.ABW, MF: formation.MF, ST: formation.ST};
  const raw = (mgr && mgr.slots && typeof mgr.slots === "object") ? mgr.slots : {};
  const slots = {};
  ["TW","ABW","MF","ST"].forEach(g => {
    const arr = Array.isArray(raw[g]) ? raw[g].slice(0, need[g]) : [];
    while (arr.length < need[g]) arr.push(null);
    slots[g] = arr;
  });
  return slots;
}

function findSlot(slots, playerId) {
  for (const g of ["TW","ABW","MF","ST"]) {
    const i = slots[g].indexOf(playerId);
    if (i >= 0) return {group: g, index: i};
  }
  return null;
}

async function persistSlots(slots) {
  if (state.managers[state.managerId]) state.managers[state.managerId].slots = slots;
  render();
  if (db) await db.doc("managers/" + state.managerId).update({slots});
}

async function toggleStarter(playerId) {
  if (Date.now() < suppressTapUntil) return;
  if (guardLock()) return;
  if (state.lineupMode !== "manual") {
    showToast("Umschalten auf 'Manuell' um selbst aufzustellen ✋");
    return;
  }
  const p = state.players[playerId];
  if (!p || p.ownerId !== state.managerId) return;
  const slots = getMySlots();
  const found = findSlot(slots, playerId);
  if (found) {
    slots[found.group][found.index] = null;
  } else {
    const idx = slots[p.pos].indexOf(null);
    if (idx === -1) { showToast("Position voll! Erst jemanden runternehmen 🚫"); return; }
    slots[p.pos][idx] = playerId;
  }
  await persistSlots(slots);
}

async function dragSwap(draggedId, targetPlayerId) {
  if (guardLock()) return;
  const dragged = state.players[draggedId];
  const target = state.players[targetPlayerId];
  if (!dragged || !target) return;
  if (dragged.ownerId !== state.managerId) return;
  if (draggedId === targetPlayerId) return;
  if (dragged.pos !== target.pos) { showToast("Falsche Position 🚫"); return; }
  const slots = getMySlots();
  const targetSlot = findSlot(slots, targetPlayerId);
  if (!targetSlot) return;
  const draggedSlot = findSlot(slots, draggedId);
  if (draggedSlot) slots[draggedSlot.group][draggedSlot.index] = targetPlayerId;
  slots[targetSlot.group][targetSlot.index] = draggedId;
  await persistSlots(slots);
}

async function dragToEmptySlot(draggedId, posGroup, slotIndex) {
  if (guardLock()) return;
  const dragged = state.players[draggedId];
  if (!dragged || dragged.ownerId !== state.managerId || dragged.pos !== posGroup) { showToast("Falsche Position 🚫"); return; }
  const idx = parseInt(slotIndex, 10);
  const slots = getMySlots();
  if (isNaN(idx) || idx < 0 || idx >= slots[posGroup].length) return;
  if (slots[posGroup][idx]) { showToast("Platz schon belegt 🚫"); return; }
  const draggedSlot = findSlot(slots, draggedId);
  if (draggedSlot) slots[draggedSlot.group][draggedSlot.index] = null;
  slots[posGroup][idx] = draggedId;
  await persistSlots(slots);
}

async function dragToBench(draggedId) {
  if (guardLock()) return;
  const slots = getMySlots();
  const found = findSlot(slots, draggedId);
  if (!found) return;
  slots[found.group][found.index] = null;
  await persistSlots(slots);
}

// ---------- Touch-Drag & Drop (Bank <-> Feld) ----------
let dragCtx = null;
let suppressTapUntil = 0;

function initDragAndDrop() {
  document.querySelectorAll("[data-drag-player]").forEach(el => {
    const inBench = !!el.closest(".bench-row");
    el.style.touchAction = inBench ? "pan-x" : "none";
    el.addEventListener("pointerdown", onChipPointerDown);
  });
}

function onChipPointerDown(e) {
  const el = e.currentTarget;
  dragCtx = {
    playerId: el.dataset.dragPlayer,
    sourceEl: el,
    pointerId: e.pointerId,
    startX: e.clientX,
    startY: e.clientY,
    inBench: !!el.closest(".bench-row"),
    engaged: false,
    ghost: null
  };
  document.addEventListener("pointermove", onChipPointerMove);
  document.addEventListener("pointerup", onChipPointerUp);
  document.addEventListener("pointercancel", onChipPointerCancel);
}

function engageDrag(e) {
  const el = dragCtx.sourceEl;
  const rect = el.getBoundingClientRect();
  const ghost = el.cloneNode(true);
  ghost.style.position = "fixed";
  ghost.style.left = rect.left + "px";
  ghost.style.top = rect.top + "px";
  ghost.style.width = rect.width + "px";
  ghost.style.margin = "0";
  ghost.style.pointerEvents = "none";
  ghost.style.zIndex = "999";
  ghost.style.transform = "scale(1.18)";
  ghost.style.filter = "drop-shadow(0 6px 16px rgba(0,0,0,0.5))";
  document.body.appendChild(ghost);
  el.style.opacity = "0.25";
  try { el.setPointerCapture(dragCtx.pointerId); } catch (err) {}
  dragCtx.ghost = ghost;
  dragCtx.offsetX = e.clientX - rect.left;
  dragCtx.offsetY = e.clientY - rect.top;
  dragCtx.engaged = true;
}

function cleanupDrag() {
  document.removeEventListener("pointermove", onChipPointerMove);
  document.removeEventListener("pointerup", onChipPointerUp);
  document.removeEventListener("pointercancel", onChipPointerCancel);
  document.querySelectorAll(".drop-hover").forEach(x => x.classList.remove("drop-hover"));
  if (!dragCtx) return null;
  const ctx = dragCtx;
  if (ctx.ghost) ctx.ghost.remove();
  ctx.sourceEl.style.opacity = "";
  if (ctx.engaged) { try { ctx.sourceEl.releasePointerCapture(ctx.pointerId); } catch (err) {} }
  dragCtx = null;
  return ctx;
}

function onChipPointerCancel() {
  cleanupDrag(); // abgebrochen, kein Drop ausführen
}

function onChipPointerMove(e) {
  if (!dragCtx) return;
  if (!dragCtx.engaged) {
    const dx = e.clientX - dragCtx.startX;
    const dy = e.clientY - dragCtx.startY;
    if (dragCtx.inBench) {
      // Bank: erst entscheiden ob Wisch-Scroll (horizontal) oder Drag (vertikal) gemeint ist
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx) * 1.2) {
        engageDrag(e);
      } else if (Math.abs(dx) > 10) {
        cleanupDrag(); // horizontales Wischen -> nativer Scroll übernimmt
        return;
      } else {
        return; // noch unentschieden, abwarten
      }
    } else {
      // Feld-Chips scrollen nicht, hier reicht jede Bewegung als Drag-Start
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) engageDrag(e);
      else return;
    }
  }
  e.preventDefault();
  dragCtx.ghost.style.left = (e.clientX - dragCtx.offsetX) + "px";
  dragCtx.ghost.style.top = (e.clientY - dragCtx.offsetY) + "px";
  document.querySelectorAll(".drop-hover").forEach(x => x.classList.remove("drop-hover"));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const target = el && el.closest("[data-drop-player], [data-drop-pos], [data-drop-bench]");
  if (target) target.classList.add("drop-hover");
}

function onChipPointerUp(e) {
  const ctx = cleanupDrag();
  if (!ctx || !ctx.engaged) return; // war nur ein Tap oder ein erkannter Scroll
  suppressTapUntil = Date.now() + 300;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const target = el && el.closest("[data-drop-player], [data-drop-pos], [data-drop-bench]");
  if (!target) return;
  if (target.dataset.dropPlayer) dragSwap(ctx.playerId, target.dataset.dropPlayer);
  else if (target.dataset.dropPos) dragToEmptySlot(ctx.playerId, target.dataset.dropPos, target.dataset.dropIndex);
  else if (target.dataset.dropBench) dragToBench(ctx.playerId);
}

function pitchChip(p, isStarter, captainId) {
  const tier = rarityTier(p.value);
  const shortName = p.name.split(" ").slice(-1)[0];
  const manual = state.lineupMode === "manual";
  const modeCls = manual ? (isStarter ? "pchip-selected" : "pchip-selectable") : "";
  const isCap = isStarter && p.id === captainId;
  const capBadge = isStarter ? `<div class="cap-badge ${isCap?'active':''}" data-captain="${p.id}">C</div>` : "";
  const dragAttrs = manual ? `data-drag-player="${p.id}" data-pos-group="${p.pos}" ${isStarter ? `data-drop-player="${p.id}"` : ""}` : "";
  return `
    <div class="pchip-wrap" data-toggle-start="${p.id}" title="Tippen zum Wechseln" ${dragAttrs}>
      ${capBadge}
      <div class="pchip tier-${tier} ${modeCls}">${fmtM(costOf(p))}</div>
      <div class="pchip-name">${shortName}${isCap?' 👑':''}</div>
      <div class="pchip-pts">${(p.points||0) * (isCap?2:1)} Pkt</div>
    </div>
  `;
}

function emptySlotChip(posGroup, index) {
  const manual = state.lineupMode === "manual";
  const dropAttr = manual ? `data-drop-pos="${posGroup}" data-drop-index="${index}"` : "";
  return `
    <div class="pchip-wrap" ${dropAttr}>
      <div class="pchip pchip-empty">+</div>
      <div class="pchip-name" style="opacity:0.55;">leer</div>
    </div>
  `;
}

function pickLineup(squad, formation, mode, slots) {
  const need = {TW:1, ABW: formation.ABW, MF: formation.MF, ST: formation.ST};
  const starters = {};
  if (mode === "manual") {
    const byId = {};
    squad.forEach(p => byId[p.id] = p);
    ["TW","ABW","MF","ST"].forEach(g => {
      const arr = (slots && slots[g] ? slots[g] : []).map(id => id ? (byId[id] || null) : null);
      while (arr.length < need[g]) arr.push(null);
      starters[g] = arr.slice(0, need[g]);
    });
  } else {
    const groups = {TW:[], ABW:[], MF:[], ST:[]};
    squad.forEach(p => groups[p.pos].push(p));
    Object.keys(groups).forEach(k => groups[k].sort((a,b) => b.value - a.value));
    ["TW","ABW","MF","ST"].forEach(g => {
      const picked = groups[g].slice(0, need[g]);
      while (picked.length < need[g]) picked.push(null);
      starters[g] = picked;
    });
  }
  const starterIdsFlat = new Set(Object.values(starters).flat().filter(Boolean).map(p => p.id));
  const bench = squad.filter(p => !starterIdsFlat.has(p.id));
  return {starters, need, bench};
}

function pitchRow(cellsArr, captainId, posGroup) {
  const cells = cellsArr.map((p, idx) => p ? pitchChip(p, true, captainId) : emptySlotChip(posGroup, idx));
  return `<div class="pitch-row">${cells.join("")}</div>`;
}

function renderPitch(squad, formation, mode, slots, captainId) {
  const {starters} = pickLineup(squad, formation, mode, slots);
  return `
    <div class="pitch ${isLocked()?'locked-zone':''}">
      <div class="pitch-lines">
        <div class="pitch-edge"></div>
        <div class="pitch-box-top"></div>
        <div class="pitch-box-bottom"></div>
        <div class="pitch-halfway"></div>
        <div class="pitch-circle"></div>
        <div class="pitch-dot"></div>
      </div>
      ${squad.length === 0 ? `<div class="pitch-empty">🈳 Kader leer.<br>Geh zum Transfermarkt und stell dein Team auf!</div>` : ""}
      <div class="pitch-rows">
        ${pitchRow(starters.ST, captainId, "ST")}
        ${pitchRow(starters.MF, captainId, "MF")}
        ${pitchRow(starters.ABW, captainId, "ABW")}
        ${pitchRow(starters.TW, captainId, "TW")}
      </div>
    </div>
  `;
}

function renderFormationPicker() {
  return `
    <div class="filter-row ${isLocked()?'locked-zone':''}">
      ${FORMATIONS.map(f => `<div class="filter-chip ${state.formation===f.key?'active':''}" data-formation="${f.key}">${f.label}</div>`).join("")}
    </div>
  `;
}

function renderModeToggle() {
  return `
    <div class="mode-toggle ${isLocked()?'locked-zone':''}">
      <button class="mode-btn ${state.lineupMode==='auto'?'active':''}" data-mode="auto">🤖 Auto (nach Wert)</button>
      <button class="mode-btn ${state.lineupMode==='manual'?'active':''}" data-mode="manual">✋ Manuell</button>
    </div>
  `;
}

function renderDeadlineBanner() {
  const dl = getDeadline();
  if (!dl) return `<div class="deadline-banner open"><div><div class="deadline-label">⏱ Keine Deadline gesetzt</div><div class="deadline-sub">Aufstellung frei änderbar</div></div></div>`;
  const locked = isLocked();
  return `
    <div class="deadline-banner ${locked?'locked':'open'}">
      <div>
        <div class="deadline-label">${locked?'🔒':'⏱'} ${formatDeadline(dl)}</div>
        <div class="deadline-sub">${locked?'Aufstellung gesperrt':remainingLabel(dl)}</div>
      </div>
      ${locked?'<div class="locked-tag">GESPERRT</div>':''}
    </div>
  `;
}

function renderKader() {
  const squad = mySquad().sort((a,b) => POS_ORDER[a.pos]-POS_ORDER[b.pos]);
  const used = myBudgetUsed();
  const remaining = BUDGET_TOTAL - used;
  const formation = getFormation(state.formation);
  const slots = getMySlots();
  const captainId = myCaptainId();
  const {bench} = pickLineup(squad, formation, state.lineupMode, slots);
  const complete = isLineupComplete(state.managerId);
  const notEligible = isLocked() && !complete;
  const score = computeManagerScore(state.managerId);
  const activeSubs = score.effectiveStarters.filter(e => e.isSub);
  return `
    <div class="panel">
      <div class="stat-row">
        <div class="stat budget"><div class="val">${remaining}M</div><div class="lab">Budget frei</div></div>
        <div class="stat"><div class="val">${squad.length}/${SQUAD_SIZE_LIMIT}</div><div class="lab">Kadergröße</div></div>
        <div class="stat points"><div class="val">${myPoints()}</div><div class="lab">Punkte</div></div>
      </div>
    </div>
    ${notEligible ? `
      <div class="panel" style="border-color:#ff5c5c; background:rgba(255,92,92,0.1);">
        <h2 style="color:#ff5c5c;">❌ Team unvollständig</h2>
        <div class="hint">Beim Anpfiff hatte deine Startelf leere Plätze. Ihr nehmt diesen Spieltag mit 0 Punkten teil. Formation kann erst nach der nächsten Deadline-Freigabe wieder geändert werden.</div>
      </div>
    ` : !complete ? `
      <div class="panel" style="border-color:var(--gold);">
        <div class="hint">⚠️ Deine Startelf hat noch leere Plätze. Vor dem nächsten Anpfiff auffüllen, sonst zählt der Spieltag nicht.</div>
      </div>
    ` : ""}
    <div class="panel">
      <h2>🏟️ Aufstellung · ${formation.label}</h2>
      ${renderDeadlineBanner()}
      ${renderModeToggle()}
      ${renderFormationPicker()}
      ${renderPitch(squad, formation, state.lineupMode, slots, captainId)}
      <div class="hint" style="margin-top:10px; text-align:center;">
        👑 Krone auf einem Starter tippen = Kapitän, zählt doppelt. Nur die Startelf bringt Punkte, die Bank nicht.<br>
        Startelf-Spieler, die real ausgewechselt wurden, werden für die Wertung automatisch durch den besten passenden Bank-Spieler ersetzt.<br>
        ${state.lineupMode === "manual" ? "Bank-Spieler antippen holt sie rein, Starter antippen bänkt sie." : "Startelf läuft automatisch nach Marktwert. Auf 'Manuell' umschalten für eigene Wahl."}
      </div>
      ${activeSubs.length > 0 ? `
        <div class="hint" style="margin-top:10px; padding:10px; background:rgba(63,214,107,0.12); border-radius:10px; color:#3fd66b;">
          🔄 Aktive Einwechslungen: ${activeSubs.map(s => `${s.player.name} (für ${s.replacedName})`).join(", ")}
        </div>
      ` : ""}
    </div>
    <div class="panel">
      <h2>🪑 Bank (${bench.length})</h2>
      ${bench.length === 0 ? `<div class="hint">Keine Wechselspieler. Holt euch mehr Kader-Breite für Rotation zwischen den Spieltagen.</div>` : `
        <div class="bench-row" ${state.lineupMode==='manual' ? 'data-drop-bench="true"' : ''}>${bench.map(p => pitchChip(p, false, captainId)).join("")}</div>
      `}
    </div>
    <div class="panel">
      <h2 class="collapsible-header" data-toggle-kv style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
        <span>🧍 Kader verwalten (${squad.length})</span>
        <span style="font-size:14px;">${state.kaderVerwaltenOpen ? '▲' : '▼'}</span>
      </h2>
      ${state.kaderVerwaltenOpen ? `
        <div class="fcard-grid" style="margin-top:12px;">
          ${squad.length === 0 ? `<div class="empty-state"><div class="icon">🈳</div>Noch keine Spieler.</div>` :
            squad.map(p => p.listed
              ? fcard(p, `
                  <button class="btn-disabled" data-delist="${p.id}" style="cursor:pointer; opacity:1;">🏷️ Gelistet, zurückziehen</button>
                  <button class="btn-sell" data-instant-sell="${p.id}" style="margin-top:6px;">⚡ Sofort verkaufen (${fmtM(priceOf(p))})</button>
                `, incomingOffersHtml(p))
              : fcard(p, `<button class="btn-sell" data-list="${p.id}">🏷️ Verkaufen (Angebote)</button>`)
            ).join("")}
        </div>
      ` : ""}
    </div>
  `;
}

function marketActionHtml(p) {
  const myOffer = myActiveOfferOn(p.id);
  if (myOffer && myOffer.status === "countered") {
    return `
      <div class="offer-box">
        <div class="offer-line">Gegenangebot: <strong>${fmtM(myOffer.counterAmount)}</strong></div>
        <div class="offer-btnrow">
          <button class="btn-buy" data-counter-accept="${myOffer.id}">Annehmen</button>
          <button class="btn-sell" data-counter-reject="${myOffer.id}">Ablehnen</button>
        </div>
      </div>
    `;
  }
  if (myOffer && myOffer.status === "pending") {
    return `
      <div class="offer-box">
        <div class="offer-line">Dein Angebot: <strong>${fmtM(myOffer.amount)}</strong> (wartet...)</div>
        <button class="btn-disabled" data-withdraw="${myOffer.id}" style="cursor:pointer; opacity:1; margin-top:6px;">Zurückziehen</button>
      </div>
    `;
  }
  return `
    <div class="offer-box">
      <input type="number" placeholder="Angebot in M" data-offer-input="${p.id}" min="1">
      <button class="btn-buy" data-make-offer="${p.id}" style="margin-top:6px;">💰 Angebot machen</button>
    </div>
  `;
}

function incomingOffersHtml(p) {
  const offers = offersForPlayer(p.id).filter(o => o.status === "pending" || o.status === "countered");
  if (offers.length === 0) return "";
  return `
    <div class="incoming-offers">
      ${offers.map(o => `
        <div class="offer-box">
          <div class="offer-line">${o.buyerName}: <strong>${fmtM(o.amount)}</strong>${o.status==="countered" ? ` · dein Gegenangebot ${fmtM(o.counterAmount)} (wartet)` : ""}</div>
          ${o.status === "pending" ? `
            <div class="offer-btnrow">
              <button class="btn-buy" data-offer-accept="${o.id}">Annehmen</button>
              <button class="btn-sell" data-offer-reject="${o.id}">Ablehnen</button>
            </div>
            <input type="number" placeholder="Gegenangebot in M" data-counter-input="${o.id}" min="1" style="margin-top:6px;">
            <button class="btn-disabled" data-offer-counter="${o.id}" style="cursor:pointer; opacity:1; margin-top:6px;">Gegenangebot senden</button>
          ` : `<div class="hint">Wartet auf Antwort des Käufers</div>`}
        </div>
      `).join("")}
    </div>
  `;
}

function renderMarkt() {
  const filters = ["ALLE","TW","ABW","MF","ST"];
  const available = Object.values(state.players).filter(p => !p.ownerId || (p.listed && p.ownerId !== state.managerId));
  const filtered = state.filter === "ALLE" ? available : available.filter(p => p.pos === state.filter);
  const used = myBudgetUsed();
  const remaining = BUDGET_TOTAL - used;
  return `
    <div class="panel">
      <div class="stat-row"><div class="stat budget"><div class="val">${remaining}M</div><div class="lab">Budget frei</div></div></div>
    </div>
    <div class="panel">
      <h2>💱 Transfermarkt</h2>
      <div class="filter-row">
        ${filters.map(f => `<div class="filter-chip ${state.filter===f?'active':''}" data-filter="${f}">${f}</div>`).join("")}
      </div>
      ${available.length === 0 ? `
        <div class="empty-state">
          <div class="icon">📡</div>
          Keine Spielerdaten geladen.<br>
          <button class="btn-buy" id="reseedBtn" style="margin-top:14px; width:auto; padding:10px 18px;">🔄 Spielerdaten laden</button>
        </div>
      ` : filtered.length === 0 ? `
        <div class="empty-state">Aktuell nichts verfügbar. 🎉</div>
      ` : `
        <div class="fcard-grid">
          ${filtered.map(p => p.listed
            ? fcard(p, marketActionHtml(p))
            : fcard(p, `<button class="btn-buy" data-buy="${p.id}">Kaufen</button>`)
          ).join("")}
        </div>
      `}
    </div>
  `;
}

function renderTabelle() {
  const mgrs = Object.entries(state.managers).map(([id, m]) => {
    const score = computeManagerScore(id);
    return {id, name: m.name, points: score.total, squadSize: score.squadSize, value: score.squadValue, eligible: score.eligible};
  }).sort((a,b) => b.points - a.points);

  return `
    <div class="panel">
      <h2>🏆 Liga-Tabelle</h2>
      <div class="hint" style="margin-bottom:10px;">Gewertet wird nur die Startelf, Kapitän zählt doppelt. Bei Anpfiff unvollständige Teams zählen 0 Punkte für den Spieltag.</div>
      ${mgrs.length === 0 ? `<div class="empty-state">Noch keine Manager.</div>` :
        mgrs.map((m, i) => `
        <div class="table-row">
          <div class="rank ${i===0?'r1':i===1?'r2':i===2?'r3':''}">${i+1}</div>
          <div style="flex:1;">
            <div class="mgr-name">${m.name}${m.id===state.managerId?' (du)':''}</div>
            <div class="mgr-detail">${m.squadSize} Spieler · ${m.value}M Kaderwert${!m.eligible ? ' · <span style="color:#ff5c5c;">❌ Team unvollständig</span>' : ''}</div>
          </div>
          <div class="mgr-points">${m.points}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderAdmin() {
  const all = Object.values(state.players).filter(p => p.ownerId).sort((a,b) => POS_ORDER[a.pos]-POS_ORDER[b.pos]);
  const dl = getDeadline();
  return `
    <div class="panel">
      <h2>👤 Konto</h2>
      <div class="hint">Angemeldet als <strong>${state.managerName}</strong>${isHost() ? ' · 👑 Host' : ''}</div>
      <button class="btn-sell" id="logoutBtn" style="margin-top:10px; width:auto; padding:9px 16px;">Abmelden</button>
    </div>
    <div class="panel">
      <h2>⏱ Spieltag-Deadline</h2>
      <div class="hint">Vor dem ersten Anpfiff sperren sich Formation, Manuell/Auto-Wahl und Kapitän für alle. Nur der Host (${state.managers[hostId()]?.name || '?'}) darf die Deadline ändern.</div>
      ${renderDeadlineBanner()}
      ${isHost() ? `
        <div class="hint" style="margin-top:12px; margin-bottom:8px;">📅 Nächster bekannter Anstoß laut Spielplan:</div>
        <button class="btn-buy" id="acceptDeadlineBtn" style="width:auto; padding:9px 16px;">${NEXT_MATCHDAY.label} übernehmen</button>
        <div class="hint" style="margin-top:14px;">Oder manuell:</div>
        <div class="deadline-form">
          <input type="datetime-local" id="deadlineInput" value="${dl ? new Date(dl).toISOString().slice(0,16) : ''}">
          <button class="btn-buy" id="setDeadlineBtn">Setzen</button>
        </div>
        ${dl ? `<button class="btn-disabled" id="clearDeadlineBtn" style="margin-top:8px; cursor:pointer; opacity:1;">Sperre aufheben</button>` : ""}
      ` : `
        <div class="hint" style="margin-top:10px;">Nur der Host kann hier Änderungen vornehmen.</div>
      `}
    </div>
    <div class="panel">
      <h2>⚙️ Punkte eintragen</h2>
      <div class="hint">Jeder in der Liga kann hier die Spieltags-Punkte pflegen. Frag mich (Claude) im Chat nach den aktuellen Bundesliga-Live-Stats, du trägst sie hier ein, alle sehen es sofort.</div>
    </div>
    <div class="panel">
      <div class="hint" style="margin-bottom:10px;">Häkchen setzen bei "nicht gespielt", wenn der Spieler laut echtem Spieltag real ausgewechselt/gar nicht eingesetzt wurde. Dann springt automatisch der beste Bank-Spieler gleicher Position für die Wertung ein.</div>
      ${all.length === 0 ? `<div class="empty-state">Noch keine Spieler im Einsatz.</div>` :
        all.map(p => `
        <div class="admin-row">
          <div class="pos-chip">${p.pos}</div>
          <div class="p-info"><div class="p-name">${p.name}</div><div class="p-club">${state.managers[p.ownerId]?.name || '?'}</div></div>
          <label class="dnp-toggle"><input type="checkbox" ${p.didNotPlay?'checked':''} data-dnp="${p.id}"> nicht gespielt</label>
          <input type="number" value="${p.points||0}" data-points="${p.id}">
        </div>
      `).join("")}
    </div>
    <div class="panel">
      <h2>🔄 Spielerdaten aktualisieren</h2>
      <div class="hint">Für kleine Korrekturen (ein Name/Klub stimmt nicht mehr). Gleicht Namen, Klubs und Marktwerte ab, Käufe und Punkte bleiben erhalten. Für einen kompletten Spieler-Datenbank-Neuaufbau (IDs wurden neu gemischt) bitte stattdessen unten "Liga zurücksetzen" nutzen.</div>
      <button class="btn-buy" id="refreshDataBtn" style="margin-top:10px; width:auto; padding:9px 16px;">🔄 Jetzt aktualisieren</button>
    </div>
    <div class="panel">
      <h2>🧹 Liga zurücksetzen</h2>
      <div class="hint">Löscht ALLE Manager-Konten UND die komplette Spieler-Datenbank, baut sie danach frisch aus der aktuellen Kader-Liste wieder auf. Nicht rückgängig zu machen. Nutzt das jetzt einmal, um auf die korrigierte 18-Klub-Liste (Stand bundesliga.com) zu wechseln.</div>
      <button class="btn-sell" id="resetBtn" style="margin-top:10px; width:auto; padding:9px 16px;">${state.resetConfirm ? '⚠️ Wirklich? Nochmal tippen' : '🧹 Liga zurücksetzen'}</button>
    </div>
  `;
}

function attachMainEvents() {
  document.querySelectorAll("[data-tab]").forEach(el => { el.onclick = () => { state.tab = el.dataset.tab; render(); }; });
  document.querySelectorAll("[data-buy]").forEach(el => { el.onclick = () => buyPlayer(el.dataset.buy); });
  document.querySelectorAll("[data-toggle-kv]").forEach(el => { el.onclick = () => { state.kaderVerwaltenOpen = !state.kaderVerwaltenOpen; render(); }; });
  document.querySelectorAll("[data-list]").forEach(el => { el.onclick = () => listForSale(el.dataset.list); });
  document.querySelectorAll("[data-delist]").forEach(el => { el.onclick = () => delist(el.dataset.delist); });
  document.querySelectorAll("[data-instant-sell]").forEach(el => { el.onclick = () => instantSell(el.dataset.instantSell); });
  document.querySelectorAll("[data-make-offer]").forEach(el => {
    el.onclick = () => {
      const input = document.querySelector(`[data-offer-input="${el.dataset.makeOffer}"]`);
      makeOffer(el.dataset.makeOffer, input ? input.value : "");
    };
  });
  document.querySelectorAll("[data-withdraw]").forEach(el => { el.onclick = () => withdrawOffer(el.dataset.withdraw); });
  document.querySelectorAll("[data-offer-accept]").forEach(el => { el.onclick = () => respondToOffer(el.dataset.offerAccept, "accept"); });
  document.querySelectorAll("[data-offer-reject]").forEach(el => { el.onclick = () => respondToOffer(el.dataset.offerReject, "reject"); });
  document.querySelectorAll("[data-offer-counter]").forEach(el => {
    el.onclick = () => {
      const input = document.querySelector(`[data-counter-input="${el.dataset.offerCounter}"]`);
      respondToOffer(el.dataset.offerCounter, "counter", input ? input.value : "");
    };
  });
  document.querySelectorAll("[data-counter-accept]").forEach(el => { el.onclick = () => respondToCounter(el.dataset.counterAccept, "accept"); });
  document.querySelectorAll("[data-counter-reject]").forEach(el => { el.onclick = () => respondToCounter(el.dataset.counterReject, "reject"); });
  document.querySelectorAll("[data-filter]").forEach(el => { el.onclick = () => { state.filter = el.dataset.filter; render(); }; });
  document.querySelectorAll("[data-formation]").forEach(el => { el.onclick = () => setFormation(el.dataset.formation); });
  document.querySelectorAll("[data-mode]").forEach(el => { el.onclick = () => setLineupMode(el.dataset.mode); });
  document.querySelectorAll("[data-toggle-start]").forEach(el => { el.onclick = () => toggleStarter(el.dataset.toggleStart); });
  document.querySelectorAll("[data-captain]").forEach(el => { el.onclick = (e) => { e.stopPropagation(); setCaptain(el.dataset.captain); }; });
  const reseedBtn = document.getElementById("reseedBtn");
  if (reseedBtn) reseedBtn.onclick = async () => {
    reseedBtn.textContent = "Lädt...";
    try {
      if (!db) { showToast("Datenbank noch nicht bereit, kurz warten und nochmal versuchen ⏳"); reseedBtn.textContent = "🔄 Spielerdaten laden"; return; }
      await withTimeout(ensureSeeded(true), 45000, "Spielerdaten laden");
    } catch (err) {
      showToast((err && err.message) || "Fehler. Öffne den Link in der Claude-App, nicht im Browser.");
      reseedBtn.textContent = "🔄 Spielerdaten laden";
    }
  };
  const setDlBtn = document.getElementById("setDeadlineBtn");
  if (setDlBtn) setDlBtn.onclick = () => setDeadline(document.getElementById("deadlineInput").value);
  const acceptDlBtn = document.getElementById("acceptDeadlineBtn");
  if (acceptDlBtn) acceptDlBtn.onclick = () => acceptSuggestedDeadline();
  const clearDlBtn = document.getElementById("clearDeadlineBtn");
  if (clearDlBtn) clearDlBtn.onclick = () => clearDeadline();
  document.querySelectorAll("[data-points]").forEach(el => { el.onchange = () => setPoints(el.dataset.points, el.value); });
  document.querySelectorAll("[data-dnp]").forEach(el => { el.onchange = () => setDidNotPlay(el.dataset.dnp, el.checked); });
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) logoutBtn.onclick = () => logout();
  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.onclick = () => resetLeague();
  const refreshDataBtn = document.getElementById("refreshDataBtn");
  if (refreshDataBtn) refreshDataBtn.onclick = () => refreshPlayerData();
  initDragAndDrop();
}

render();
initDb();
setInterval(() => { if (state.managerId) render(); }, 30000);
</script>
</body>
</html>
